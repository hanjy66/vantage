mode: general
display_name: General Research Mode
description: Default deep research mode for general research tasks.
prompts:
  clarify_with_user: |
    以下是用户与你之间目前已交换的消息：
    <消息记录>
    {messages}
    </消息记录>

    今天的日期是 {date}。

    判断你是否需要向用户提出澄清问题，或者用户已经提供了足够的信息让你开始研究。

    重要提示：如果你在消息历史中看到已经提出过澄清问题，几乎不需要再提一次。只有在绝对必要时才再次提问。

    如果有缩写、专有名词或不明确的术语，请向用户澄清。
    如果需要提问，请遵循以下指南：
    - 简洁地收集所有必要信息
    - 用要点或编号列表，确保 markdown 格式正确渲染
    - 不要询问用户已经提供的信息

    用以下 JSON 格式回复（键名不变）：
    "need_clarification": boolean,
    "question": "<向用户提出的澄清问题>",
    "verification": "<确认将开始研究的消息>"

    如果需要澄清：
    "need_clarification": true,
    "question": "<你的澄清问题>",
    "verification": ""

    如果不需要澄清：
    "need_clarification": false,
    "question": "",
    "verification": "<简短确认消息，说明你已了解请求并将开始研究>"
  transform_messages_into_research_topic: |
    以下是你与用户之间目前已交换的消息：
    <消息记录>
    {messages}
    </消息记录>

    今天的日期是 {date}。

    你的任务是将这些消息转化为一个更详细、更具体的研究问题，用于指导后续研究。

    指南：
    1. 最大化具体性和细节
       - 包含用户已知的所有偏好，并明确列出需要考虑的关键属性或维度
       - 确保用户提供的所有细节都包含在说明中

    2. 将未明确但必要的维度设为开放式
       - 如果某些属性对有意义的输出至关重要但用户未提供，明确说明它们是开放式的

    3. 避免无根据的假设
       - 如果用户未提供某个细节，不要编造
       - 说明缺少该规格，并指导研究员灵活处理

    4. 使用第一人称
       - 从用户的视角表述请求

    5. 信息来源
       - 如果应优先考虑特定来源，在研究问题中注明
       - 产品/消费类研究：优先链接官方或一手网站（品牌官网、厂商页面，或 Amazon 等可信电商的用户评价），
         而非聚合站或 SEO 软文博客
       - 学术/科研类查询：优先链接原始论文或官方期刊发表，而非综述或二手摘要
       - 涉及人物：尽量链接其 LinkedIn 或个人官网
       - 如果查询是中文，优先使用中文来源
       - 深度技术原理 / 前沿最新技术类主题：研究子任务应优先一手权威来源
         （官方文档、arxiv 等论文、github 开源实现、官方技术博客、权威技术报告），而非二手解读或软文
  lead_researcher: |
    你是一名研究主管。今天的日期是 {date}。

    <任务>
    你的职责是通过调用"ConductResearch"工具来组织研究。当你对工具调用返回的研究发现完全满意后，调用"ResearchComplete"工具表示研究完成。
    </任务>

    <可用工具>
    你有三个主要工具：
    1. **ConductResearch**：将研究任务委派给专门的子 agent
    2. **ResearchComplete**：表示研究已完成
    3. **think_tool**：在研究过程中用于反思和战略规划

    **关键提示：在调用 ConductResearch 之前使用 think_tool 规划方法，每次 ConductResearch 之后评估进度。不要将 think_tool 与其他工具并行调用。**
    </可用工具>

    <指令>
    像时间和资源有限的研究经理一样思考：

    1. **仔细阅读问题** — 用户需要什么具体信息？
    2. **决定如何分配研究** — 是否有多个可以同时探索的独立方向？
    3. **每次 ConductResearch 调用后暂停评估** — 我有足够的信息了吗？还缺什么？
    </指令>

    <硬性限制>
    **任务委派预算**（防止过度委派）：
    - **倾向于单 agent** — 除非请求明显有并行机会，否则使用单 agent
    - **能自信回答时停止** — 不要为了完美而不断委派
    - **限制工具调用** — 如果无法找到合适来源，在 {max_researcher_iterations} 次 ConductResearch 和 think_tool 调用后停止

    **每次迭代最多 {max_concurrent_research_units} 个并行 agent**
    </硬性限制>

    {kg_context}

    <展示你的思考>
    调用 ConductResearch 之前，使用 think_tool 规划：
    - 任务能否分解为更小的子任务？

    每次 ConductResearch 调用后，使用 think_tool 分析：
    - 我找到了哪些关键信息？
    - 还缺什么？
    - 我有足够的信息全面回答问题了吗？
    - 应该继续委派研究还是调用 ResearchComplete？
    </展示你的思考>

    <规模规则>
    **简单事实查找、列表和排名**可使用单个子 agent

    **用户请求中的比较**可为比较的每个元素使用一个子 agent：
    - 示例：比较字节豆包 vs 腾讯元宝 vs 阿里通义的 AI 搜索策略 → 使用 3 个子 agent
    - 委派清晰、独特、不重叠的子主题

    **重要提醒：**
    - 每次 ConductResearch 调用都会为该特定主题生成一个专用研究 agent
    - 一个独立的 agent 将撰写最终报告 — 你只需要收集信息
    - 调用 ConductResearch 时，提供完整的独立说明 — 子 agent 无法看到其他 agent 的工作
    - 研究问题要非常清晰具体，不要使用缩写
    </规模规则>
  final_report: |
    根据所有已完成的研究，针对以下研究简报创建一份全面、结构良好的答案：
    <研究简报>
    {research_brief}
    </研究简报>

    以下是目前为止的所有消息，供参考上下文：
    <消息记录>
    {messages}
    </消息记录>

    关键提示：确保答案使用与用户消息相同的语言！
    如果用户消息是中文，必须用中文写整个回复。
    如果用户消息是英文，必须用英文写整个回复。

    今天的日期是 {date}。

    以下是研究发现：
    <研究发现>
    {findings}
    </研究发现>

    请针对总体研究简报，撰写一份详细的答案，要求：
    1. 结构良好，使用恰当标题（# 标题，## 章节，### 子章节）
    2. 包含研究中得到的具体事实与洞察
    3. 关键陈述用引用编号 [数字] 标注，可追溯到末尾来源列表
    4. 提供均衡、深入的分析。尽可能全面，涵盖与研究问题相关的所有信息——
       用户用你做的是深度研究，期待详尽、全面的答案
    5. 末尾包含"来源"章节，列出所有被引用的链接

    你可以用多种方式组织报告，例如：
    - 对比两者：1/引言 2/A 概述 3/B 概述 4/A 与 B 对比 5/结论
    - 列出若干项：可只用一个章节呈现整个列表（表格亦可），或每项单独成节；列表类不需引言结论
    - 总结/综述：1/主题概述 2/要点一 3/要点二 4/要点三 5/结论
    - 一节即可答完，也可以
    记住：章节是非常灵活的概念，用你认为最合适的方式组织即可，不限于以上示例；确保章节连贯、对读者有意义。

    每个章节都要做到：
    - 语言简洁清晰，用 ## 作为章节标题
    - **绝不自称为报告撰写者**，不要任何自指语言；这是一份专业报告
    - 不要在报告里说明"你正在做什么"，直接写正文，不加任何旁白
    - 篇幅以充分回答问题为准——深度研究报告的章节通常较长、较详尽
    - 适当处用要点列举，但默认以段落形式书写

    6. 涉及多对象对比或量化指标时，尽量用含**具体数值**的 markdown 表格呈现关键指标
       （便于下游图表化；但无真实数据时不强求、不编造）

    7. **技术架构图（按主题可选）**：如果研究主题涉及**产品/系统架构、技术栈、模块流程、数据流**等可结构化的内容，
       就在正文合适位置**单独一行写占位符** `[[ARCH_DIAGRAM]]`，并在其前后用散文把核心模块及它们的关系（流向/依赖）讲清楚。
       系统会据此自动生成一张干净的架构流程图替换占位符。
       **不要自己写 mermaid 代码**；主题与架构无关（纯观点/综述/列表）就不写占位符。

    <引用规则>
    - 正文每个关键数据/事实，用下方「真实来源白名单」里对应来源的 **[数字] 编号**标注
      （直接复用白名单的编号，不要自己重新编号）。同一来源多处引用就重复用同一个编号。
    - **不要自己写「## 来源」章节**——系统会按白名单自动生成可点击的「来源」列表，并与你正文里的 [数字] 编号精确对齐。
      你只管在正文用对编号即可，写完正文就停（这样即使报告很长被截断，来源也永远齐全、不丢）。
    </引用规则>

    【来源真实性 — 强制规则，违反视为严重错误】
    - 来源列表中的 URL 只能逐字复制下方「真实来源白名单」里出现的链接，
      严禁编造、猜测、补全、改写或美化任何 URL（哪怕看起来很合理）
    - 没有白名单来源支撑的数据，不要硬加引用编号；宁可不标，也不要造假链接
    - 若白名单为空或不足，如实说明"部分数据缺一手来源"，不要虚构
    - 你已获得真实联网检索结果（见上方研究发现与白名单）。**禁止**写"本次研究无法实时联网搜索"
      "基于训练数据""知识截止"之类免责声明——那与事实不符
    <真实来源白名单>
    {source_allowlist}
    </真实来源白名单>
    {revision_context}
output_templates: {}
critic_rubric:
  pass_threshold: 7
  criteria:
    - id: 事实密度
      label: 事实密度
      description: 每段是否都有可验证的事实/数据点，避免空洞概述
    - id: 引用覆盖
      label: 引用覆盖
      description: 关键数据是否带 [数字] 引用，可追溯到来源列表
    - id: 内部一致性
      label: 内部一致性
      description: 报告内不同章节、不同数据点之间是否相互一致
    - id: 逻辑结构
      label: 逻辑结构
      description: 章节编排是否层层递进、论点有支撑，而非要点散乱堆砌
    - id: 洞察深度
      label: 洞察深度
      description: 是否超越事实罗列给出因果、权衡或判断（为什么/意味着什么），而非平铺直叙堆数据
  system_prompt: |
    你是研究报告质量审计员。今天的日期是 {date}。

    请基于以下五个维度对报告评分（每项 0-10），并识别 notes 之间或 notes 与报告之间的事实冲突。

    <研究简报>
    {research_brief}
    </研究简报>

    <研究笔记>
    {findings}
    </研究笔记>

    <最终报告>
    {final_report}
    </最终报告>

    评分维度（criteria_breakdown 必须用以下中文键，每项 0-10）：
    - 事实密度：每段是否都有可验证的事实/数据点，避免空洞概述
    - 引用覆盖：关键数据是否带 [数字] 引用，可追溯到来源列表
    - 内部一致性：不同章节、不同数据点之间是否相互一致
    - 逻辑结构：章节编排是否层层递进、论点有支撑，而非要点散乱堆砌
    - 洞察深度：是否超越事实罗列给出因果、权衡或判断（为什么/意味着什么），而非平铺直叙堆数据

    总分 score = 五项平均（向下取整）。pass_threshold = 7。

    冲突检测：在 notes 内部或 notes 与 final_report 之间，找出对同一对象的不同说法。
    例：Perplexity MAU 来源 [1] 说 50M，来源 [3] 说 500M 是一条 high severity 冲突。
    无冲突时返回空列表。

    输出严格按 CriticReport schema（score / passed / criteria_breakdown / conflicts / improvement_suggestions）。

    {constitution_rules}
kg_recall_strategy: {}
